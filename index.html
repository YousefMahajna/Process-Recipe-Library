<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Process Recipe Library</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface2: #eef1f5; --text: #1a2230; --muted: #5d6879;
  --border: #d9dee6; --accent: #1b6ef3; --accent-text: #ffffff; --ok: #1a7f4b; --ok-bg: #e0f4e9;
  --warn: #9a6200; --warn-bg: #fdf0d2; --bad: #b3261e; --bad-bg: #fbe4e2; --chart: #1b6ef3;
  box-sizing: border-box; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --surface2: #232b37; --text: #e8ecf2; --muted: #9aa5b5;
    --border: #2f3947; --accent: #5b9bff; --accent-text: #0b1220; --ok: #62d39a; --ok-bg: #173526;
    --warn: #f0be5a; --warn-bg: #3a2e12; --bad: #ff8d85; --bad-bg: #3b1a18; --chart: #5b9bff; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
header.top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
header.top .actions { justify-content: flex-end; }
.clock { text-align: center; line-height: 1.25; }
.clock-date { font-size: 14px; color: var(--muted); }
.clock-time { font-size: 26px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clock-rev { font-size: 12px; color: var(--muted); margin-top: 2px; }
.app-version { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 4px; }
.clock-zone { font-size: 11px; color: var(--muted); margin-top: 2px; }
@media (max-width: 820px) {
  header.top { grid-template-columns: 1fr; }
  header.top .actions { justify-content: flex-start; }
  .clock { order: -1; text-align: left; }
}
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; flex: 1; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
select, input, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 40px; }
textarea { min-height: 90px; resize: vertical; }
select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .6; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tab { border-radius: 999px; padding: 6px 14px; min-height: 36px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.tab .n { opacity: .7; margin-right: 6px; font-variant-numeric: tabular-nums; }
.recipe-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
.recipe-head h3 { margin: 0 0 4px; font-size: 20px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); }
.badge.Released { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.Draft { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge.Obsolete { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
ol.steps { margin: 0; padding-left: 22px; } ol.steps li { margin-bottom: 6px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px; }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.hit { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; margin-bottom: 8px; background: var(--surface); align-items: center; }
.hit span.m { color: var(--muted); font-size: 13px; }
.edit-row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) auto; align-items: end; margin-bottom: 8px;
  padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.gallery figure { margin: 0; }
.thumb { padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; width: 100%; background: var(--surface2); display: block; min-height: 0; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--surface2); }
.gallery figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
img.broken { background: var(--surface2); min-height: 120px; color: var(--muted); font-size: 12px; }
.photo-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
.pe { border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.pe img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; background: var(--surface2); }
.lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.lb-img { max-width: 100%; max-height: 80vh; display: flex; }
.lb-img img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 6px; }
.lb-cap { color: #fff; margin-top: 10px; text-align: center; font-size: 14px; }
.lb button { position: absolute; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 22px; padding: 0; }
.lb .lb-x { top: 12px; right: 12px; } .lb .lb-prev { left: 12px; top: 50%; } .lb .lb-next { right: 12px; top: 50%; }
@media print {
  .noprint { display: none !important; }
  body { background: #fff; color: #000; }
  .card { border-color: #999; break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div>
      <h1>Process Recipe Library</h1>
      <div class="sub">Product → Stage → Flavor. Tools, epoxies, jigs and curing in one place.</div>
      <div class="app-version" id="appVersion" aria-label="Application version"></div>
    </div>
    <div class="clock" aria-label="Current date and time">
      <time class="clock-date" id="clockDate" style="display:block"></time>
      <time class="clock-time" id="clockTime" style="display:block"></time>
      <div class="clock-zone" id="clockZone"></div>
      <div class="clock-rev" id="clockRev"></div>
    </div>
    <div class="actions" id="topActions"></div>
  </header>
  <div id="app"></div>
</div>

<script src="library-core.js?v=18.11.26b"></script>
<script src="adhesives.js?v=18.11.26b"></script>
<script src="inventory.js?v=18.11.26b"></script>
<script src="curing.js?v=18.11.26b"></script>
<script src="process-flow.js?v=18.11.26b"></script>
<script src="parts-bom.js?v=18.11.26b"></script>
<script>
(function () {
  "use strict";

  // Application release only: increment the letter for each release on the same date.
  // This value stays fixed when recipes are saved. Format matches Lab Practical Engineer.
  var APP_BUILD = { date: '2026-11-18', letter: 'b' };

  // ===================== CONFIG (edit this one line) =====================
  // Paste your Firebase Realtime Database URL here (Firebase console → Build → Realtime Database).
  var DB_URL = "https://lab-tracker-nvidia-default-rtdb.firebaseio.com";
  // Everything is stored under this folder, so it never collides with your other apps in the same database.
  var ROOT = "processRecipeLibrary";
  // =======================================================================

  var BASE = DB_URL.replace(/\/+$/, "") + "/" + ROOT + "/";
  var NOT_CONFIGURED = /YOUR-PROJECT/.test(DB_URL);
  var REFRESH_MS = 30000;
  var pageMode = location.hash === '#parts' ? 'parts' : location.hash === '#flow' ? 'flow' : location.hash === '#adhesives' ? 'adhesives' : 'recipes';
  var adhesiveProducts = {}, adhesiveProductId = 'splinter';
  var processFlows = {}, flowProductId = 'splinter', flowState = { selected: 0 };
  var partsBoms = {}, bomProductId = 'splinter', bomState = { flavor: '__all', query: '', itemId: '', optionId: '' };
  var MAX_PHOTOS = 12;
  var core = RecipeLibrary, store = core.createStore(BASE);
  var writing = false, syncError = '', lastSync = '', backupDir = null, backupMessage = '';
  var backupChain = Promise.resolve();
  var DRAFT_PREFIX = 'process-recipe-library-draft-v3';
  var tabId;
  try { tabId = sessionStorage.getItem(DRAFT_PREFIX); if (!tabId) { tabId = crypto.randomUUID(); sessionStorage.setItem(DRAFT_PREFIX, tabId); } }
  catch (e) { tabId = crypto.randomUUID(); }
  var RECOVERY_KEY = DRAFT_PREFIX + '-' + tabId;
  function rememberDraft() {
    if (!editing) return;
    try { localStorage.setItem(RECOVERY_KEY, JSON.stringify(editing)); }
    catch (e) { backupMessage = 'Browser could not keep a recovery draft. Use Download draft before leaving.'; }
  }
  document.addEventListener('input', function () { if (editing) rememberDraft(); });
  window.addEventListener('beforeunload', function (e) {
    if (editing || writing) { rememberDraft(); e.preventDefault(); e.returnValue = ''; }
  });
  function forgetDraft() { try { localStorage.removeItem(RECOVERY_KEY); } catch (e) {} }
  function showDrafts() {
    var dialog = el('dialog', { style: 'max-width:700px;width:95%;background:var(--surface);color:var(--text)' }, el('h2', {}, 'Browser recovery drafts'));
    var count = 0;
    try {
      Object.keys(localStorage).filter(function (k) { return k.indexOf(DRAFT_PREFIX) === 0; }).forEach(function (k) {
        var saved;
        try { saved = JSON.parse(localStorage.getItem(k)); } catch (e) { return; }
        if (!saved || !saved.draft) return;
        count++;
        dialog.append(el('button', { class: 'hit', onclick: function () {
          editing = clone(saved); pageMode = editing.type === 'bom' ? 'parts' : editing.type === 'flow' ? 'flow' : editing.type === 'adhesives' ? 'adhesives' : 'recipes'; rememberDraft(); dialog.close(); dialog.remove(); render();
        } }, saved.draft.product + ' · ' + (saved.draft.name || 'Unnamed draft')));
      });
    } catch (e) { dialog.append(el('div', {}, 'Browser draft storage is unavailable.')); }
    if (!count) dialog.append(el('div', {}, 'No browser recovery drafts.'));
    dialog.append(el('button', { onclick: function () { dialog.close(); dialog.remove(); } }, 'Close'));
    document.body.append(dialog); dialog.showModal();
  }
  function downloadJSON(data, name) {
    var a = document.createElement('a'), u = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
  }
  function exportSnapshot(data) { return { version: 3, exportedAt: new Date().toISOString(), databaseRoot: ROOT, data: data }; }
  function writeBackup(data) {
    if (!backupDir) return Promise.resolve();
    var dir = backupDir;
    backupChain = backupChain.then(async function () {
      var f = await dir.getFileHandle('recipe-library-' + new Date().toISOString().replace(/[:.]/g, '-') + '-' + crypto.randomUUID() + '.json', { create: true });
      var w = await f.createWritable(); await w.write(JSON.stringify(exportSnapshot(data), null, 2)); await w.close();
      backupMessage = 'External file backup saved: ' + fmtDT(new Date().toISOString());
    }).catch(function (e) { backupMessage = 'DATABASE SAVED, but external file backup failed: ' + e.message + '. Use Backup to download a copy.'; });
    return backupChain;
  }
  async function chooseBackupFolder() {
    try {
      if (!window.showDirectoryPicker) throw new Error('Folder backups are unavailable in this browser. Use Backup to download JSON files.');
      backupDir = await window.showDirectoryPicker({ mode: 'readwrite', id: 'recipe-library-backups' });
      var snap = await store.read(); await writeBackup(snap.data); render();
    } catch (e) { if (e.name !== 'AbortError') { backupMessage = e.message; render(); } }
  }
  async function afterCommit(data) {
    await writeBackup(data);
    adhesiveProducts = data.adhesiveProducts || {};
    processFlows = data.processFlows || {};
    partsBoms = data.partsBoms || {};
    recipes = Object.keys(data.recipes || {}).map(function (id) { return normRecipe(id, data.recipes[id]); });
    libUpdated = (data.meta || {}).updatedAt || ''; lastSig = ''; lastSync = new Date().toISOString(); syncError = '';
  }
  function lockEditor(locked) {
    app.querySelectorAll('input,select,textarea,button').forEach(function (e) {
      if (locked) { e.dataset.wasDisabled = e.disabled ? 'yes' : 'no'; e.disabled = true; }
      else if (e.dataset.wasDisabled) { e.disabled = e.dataset.wasDisabled === 'yes'; delete e.dataset.wasDisabled; }
    });
  }
  async function restoreDeleted() {
    if (writing || busy) return;
    try {
      var snap = await store.read(), deleted = snap.data.deleted || {}, ids = Object.keys(deleted);
      if (!ids.length) { toast = 'No deleted recipes.'; render(); return; }
      var dialog = el('dialog', { style: 'max-width:700px;width:95%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px' }, el('h2', {}, 'Deleted recipes'));
      ids.forEach(function (id) {
        var r = deleted[id].recipe;
        dialog.append(el('button', { class: 'hit', onclick: async function () {
          dialog.close(); dialog.remove(); writing = true; busy = 'Restoring recipe…'; render();
          try { await afterCommit(await store.restore(id, core.token(deleted[id]))); toast = 'Recipe restored.'; }
          catch (e) { toast = 'Restore stopped: ' + explain(e); }
          finally { writing = false; busy = ''; render(); }
        } }, r.product + ' · ' + core.flavorLabel(r) + ' · ' + r.name));
      });
      dialog.append(el('button', { onclick: function () { dialog.close(); dialog.remove(); } }, 'Close'));
      document.body.append(dialog); dialog.showModal();
    } catch (e) { toast = 'Could not load deleted recipes: ' + explain(e); render(); }
  }

  // ---------- helpers ----------
  function el(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") e.className = v;
      else if (k === "value") e.value = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }
  function append(e, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(e, x); }); return; }
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function slug(s) { return String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x"; }
  function recipeId(r) { return slug(r.product) + "__" + slug(r.flavor) + "__" + slug(r.stage); }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
  function cmp(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function blank() {
    return { product: "", flavor: "", stage: "", stageOrder: 1, name: "", rev: "A", status: "Draft",
      tools: [], epoxies: [], jigs: [], cure: { method: "", atmosphere: "", segments: [] }, steps: [], images: [], notes: "" };
  }
  // Firebase turns arrays into objects and drops empty ones, so always normalise on read.
  function toArr(x) {
    if (Array.isArray(x)) return x.filter(function (v) { return v !== null && v !== undefined; });
    if (x && typeof x === "object") return Object.keys(x).sort(function (a, b) { return Number(a) - Number(b) || cmp(a, b); }).map(function (k) { return x[k]; });
    return [];
  }
  function normRecipe(id, r) {
    var o = Object.assign(blank(), r || {});
    ["tools", "epoxies", "jigs", "steps", "images"].forEach(function (k) { o[k] = toArr(o[k]); });
    o.cure = Object.assign({ method: "", atmosphere: "", segments: [] }, o.cure || {});
    o.cure.segments = toArr(o.cure.segments);
    if (o.cure.points !== undefined) o.cure.points = toArr(o.cure.points);
    o.flavors = core.flavors(o); o.allFlavors = o.allFlavors === true;
    o.flavor = core.flavorLabel(o);
    o.id = id || o.id || recipeId(o); o._id = o.id;
    o._base = core.token(r);
    return o;
  }
  function stripLocal(r) { return core.clean(r); }

  function fmtDT(iso) {
    if (!iso) return "—";
    var d = new Date(iso); if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- state ----------
  var recipes = [], libUpdated = "", lastSig = "";
  var role = lsGet("rl-role") === "editor" ? "editor" : "viewer";
  var sel = { product: "", flavor: "", stage: "" };
  var query = "", editing = null;
  var loaded = false, loadError = "", busy = "", toast = "", confirmDelete = false;
  try { var s0 = JSON.parse(lsGet("rl-sel") || "null"); if (s0) sel = s0; } catch (e) {}
  function canEdit() { return role === "editor"; }

  var app = document.getElementById("app");
  var topActions = document.getElementById("topActions");
  var clockDate = document.getElementById("clockDate"), clockTime = document.getElementById("clockTime"), clockRev = document.getElementById("clockRev");

  function tick() {
    var n = new Date();
    clockDate.textContent = n.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    clockTime.textContent = n.toLocaleTimeString("en-GB", { hour12: false });
    clockDate.dateTime = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
    clockTime.dateTime = n.toISOString();
    document.getElementById('clockZone').textContent = 'Local time · ' + Intl.DateTimeFormat().resolvedOptions().timeZone;
  }
  function renderRev() {
    var parts = APP_BUILD.date.split('-');
    var version = parts[2] + '.' + parts[1] + '.' + parts[0].slice(-2) + APP_BUILD.letter;
    var releaseDate = new Date(APP_BUILD.date + 'T00:00:00Z').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
    var label = document.getElementById('appVersion');
    label.textContent = 'App version: Rev ' + version + ' · Updated ' + releaseDate;
    label.title = 'Website build revision. Changes only when a new application version is released.';
    clockRev.textContent = libUpdated ? 'Data last updated: ' + fmtDT(libUpdated) : 'Data last updated: —';
  }

  // ---------- database layer (Firebase Realtime Database REST) ----------
  function dbReq(method, path, body, query) {
    var opt = { method: method, cache: "no-store" };
    if (body !== undefined) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
    return fetch(BASE + path + ".json" + (query || ""), opt).then(function (res) {
      if (!res.ok) { var e = new Error("Database " + method + " failed (" + res.status + ")"); e.status = res.status; throw e; }
      return res.json();
    });
  }
  function dbGet(p, q) { return dbReq("GET", p, undefined, q); }
  function explain(e) {
    if (e.cancelled) return "";
    if (e.status === 401 || e.status === 403) return "Database access was refused. Ask the database administrator to configure authenticated access; do not enable public writes.";
    if (e.status === 404) return "Database not found. Check DB_URL at the top of index.html.";
    if (e.name === "TypeError") return "Cannot reach the database. Check your network connection and DB_URL.";
    return e.message || "Unknown error";
  }

  function load(force) {
    if (NOT_CONFIGURED) return Promise.resolve();
    return Promise.all([dbGet("recipes"), dbGet("meta/updatedAt"), dbGet("adhesiveProducts"), dbGet("processFlows"), dbGet("partsBoms")]).then(function (r) {
      var obj = r[0] || {};
      var list = Object.keys(obj).map(function (k) { return normRecipe(k, obj[k]); });
      var newest = list.reduce(function (m, x) { return x.updatedAt && x.updatedAt > m ? x.updatedAt : m; }, "");
      var ts = (r[1] && r[1] > newest) ? r[1] : (newest || r[1] || "");
      var sig = JSON.stringify([list, ts, r[2], r[3], r[4]]);
      var first = !loaded;
      if (writing) return;
      loaded = true; loadError = ''; syncError = ''; lastSync = new Date().toISOString();
      if (first || force || sig !== lastSig) { recipes = list; libUpdated = ts; adhesiveProducts = r[2] || {}; processFlows = r[3] || {}; partsBoms = r[4] || {}; lastSig = sig; }

            await saveRecipe(out, editing.draft, editing.oldId, editing.base);
            writing = false; editing = null; forgetDraft(); toast = 'Curing profile saved.'; render(); document.getElementById('curing-editor').scrollIntoView({ block: 'start' });
          } catch (e) { writing = false; lockEditor(false); renderTop(); error.textContent = 'Not saved: ' + explain(e); }
        } }, 'Save profile'),
        el('button', { onclick: function () { if (window.confirm('Discard the curing profile draft?')) { editing = null; forgetDraft(); render(); } } }, 'Cancel profile edits'),
        el('button', { onclick: function () { downloadJSON({ type: 'recipe-draft', editing: editing }, 'curing-profile-draft-' + Date.now() + '.json'); } }, 'Download draft')));
    } else if (canEdit() && recipe) {
      body.append(el('button', { class: 'primary noprint', style: 'margin-top:12px', onclick: function () {
        editing = { draft: clone(recipe), oldId: recipe._id, base: recipe._base, cureOnly: true }; rememberDraft(); render(); document.getElementById('curing-editor').scrollIntoView({ block: 'start' });
      } }, 'Edit curing profile'));
    }
    body.append(error); var result = section('Curing profile', body); result.id = 'curing-editor'; return result;
  }

  // ---------- editor ----------
  function textField(label, obj, key, opts) {
    opts = opts || {};
    var input = el(opts.area ? "textarea" : "input", { type: opts.number ? "number" : "text", value: obj[key] == null ? "" : obj[key], placeholder: opts.ph || "",
      list: opts.list,
      oninput: function (e) { obj[key] = opts.number ? (e.target.value === "" ? "" : Number(e.target.value)) : e.target.value; } });
    input.id = 'field-' + crypto.randomUUID();
    return el("div", { class: "field", style: opts.style }, label ? el("label", { for: input.id }, label) : null, input);
  }
  function listEditor(title, arr, fields, rerender) {
    var box = el("div", { class: "card" }, el("h2", {}, title));
    arr.forEach(function (item, i) {
      box.append(el("div", { class: "edit-row" },
        fields.map(function (f) { return textField(f.label, item, f.k, { number: f.number }); }),
        el("button", { class: "small danger", "aria-label": "Remove row", onclick: function () { arr.splice(i, 1); rerender(); } }, "Remove")));
    });
    box.append(el("button", { class: "small", onclick: function () { var o = {}; fields.forEach(function (f) { o[f.k] = ""; }); arr.push(o); rerender(); } }, "+ Add row"));
    return box;
  }

  async function saveRecipe(out, draft, oldId, base) {
    var photos = preparePhotos(out, draft);
    core.validate(out);
    var data = await store.save(out, oldId ? base : 'null', photos);
    await afterCommit(data);
  }

  function renderEditor() {
    var draft = editing.draft, oldId = editing.oldId;
    var root = el("div", {});
    var errBox = el("div", { class: "err", role: "alert" });
    function rerender() { rememberDraft(); var n = renderEditor(); root.replaceWith(n); root = n; }
    root.addEventListener('click', function (e) { if (writing) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
    var flavorInput = textField('Flavors (separate with commas)', draft, 'flavor', { ph: 'e.g. Flavor A, Flavor B' });
    var allBox = el('input', { type: 'checkbox', style: 'width:auto;min-height:0', checked: draft.allFlavors,
      onchange: function (e) { draft.allFlavors = e.target.checked; rerender(); } });
    if (draft.allFlavors) flavorInput.querySelector('input').disabled = true;
    var dl = el("div", {},
      el("datalist", { id: "dl-products" }, uniq(recipes.map(function (r) { return r.product; })).map(function (v) { return el("option", { value: v }); })),
      el("datalist", { id: "dl-flavors" }, uniq(recipes.map(function (r) { return r.flavor; })).map(function (v) { return el("option", { value: v }); })),
      el("datalist", { id: "dl-stages" }, uniq(recipes.map(function (r) { return r.stage; })).map(function (v) { return el("option", { value: v }); })));
    var statusSel = el("select", { onchange: function (e) { draft.status = e.target.value; } },
      ["Draft", "Released", "Obsolete"].map(function (s) { return el("option", { value: s }, s); }));
    statusSel.value = draft.status || "Draft";
    var stepsArea = el("textarea", { style: "min-height:140px", placeholder: "One step per line", value: toArr(draft.steps).join("\n"),
      oninput: function (e) { draft.steps = e.target.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean); } });
    ["tools", "epoxies", "jigs", "images", "steps"].forEach(function (k) { draft[k] = toArr(draft[k]); });
    if (!draft.cure) draft.cure = { method: "", atmosphere: "", segments: [] };
    draft.cure.segments = toArr(draft.cure.segments);

    var saveBtn = el("button", { class: "primary", onclick: save }, "Save");
    function save() {
      if (writing) return;
      errBox.textContent = '';
      if (!String(draft.product).trim() || (!draft.allFlavors && !String(draft.flavor).trim()) || !String(draft.stage).trim() || !String(draft.name).trim()) {
        errBox.textContent = "Product, flavor, stage and recipe name are required."; return;
      }
      var out = clone(draft);
      ["tools", "epoxies", "jigs"].forEach(function (k) {
        out[k] = (out[k] || []).filter(function (it) { return Object.keys(it).some(function (x) { return String(it[x]).trim(); }); });
      });
      out.cure.segments = out.cure.segments || [];
      out.flavors = core.flavors({ flavor: draft.flavor });
      out.allFlavors = draft.allFlavors === true;
      out.flavor = core.flavorLabel(out);
      out.product = out.product.trim(); out.flavor = out.flavor.trim(); out.stage = out.stage.trim();
      out.stageOrder = Number(out.stageOrder);
      out.updatedAt = new Date().toISOString();
      delete out._id;
      out.id = oldId || draft.id || core.uid();
      draft.id = out.id;
      // Validate photos after pending files receive IDs inside saveRecipe.
      rememberDraft(); writing = true; lockEditor(true); renderTop();
      saveBtn.disabled = true; saveBtn.textContent = "Saving…";
      saveRecipe(out, draft, oldId, editing.base, saveBtn).then(function () {
        writing = false; forgetDraft();
        libUpdated = out.updatedAt; lastSig = "";
        sel = { product: out.product, flavor: out.allFlavors ? 'All flavors' : out.flavors[0], stage: out.stage, recipeId: out.id };
        editing = null; toast = "Saved. Everyone sees it within 30 seconds, or when they press Refresh."; render(); window.scrollTo(0, 0);
      }).catch(function (e) {
        writing = false; lockEditor(false); renderTop(); rememberDraft();
        saveBtn.disabled = false; saveBtn.textContent = 'Save';
        if (!e.cancelled) errBox.textContent = "Not saved: " + explain(e) + " Your edits are still on screen.";
      });
    }

    var delBtn = null;
    if (oldId) {
      delBtn = el("button", { class: "danger", onclick: function () {
        if (!confirmDelete) { confirmDelete = true; delBtn.textContent = "Click again to delete"; return; }
        delBtn.disabled = true;
        writing = true; lockEditor(true); renderTop();
        store.remove(oldId, editing.base).then(afterCommit)
          .then(function () { writing = false; forgetDraft(); editing = null; confirmDelete = false; render(); })
          .catch(function (e) { writing = false; lockEditor(false); renderTop(); delBtn.disabled = false; errBox.textContent = 'Not deleted: ' + explain(e); });

      } }, "Delete");
    }

    var histBox = el("div", {});
    var histBtn = oldId ? el("button", { onclick: function () {
      histBox.replaceChildren(el("div", { class: "sub" }, "Loading history…"));
      dbGet("history/" + oldId).then(function (h) {
        var keys = Object.keys(h || {}).sort(function (a, b) { return parseInt(b, 10) - parseInt(a, 10); }).slice(0, 100);
        if (!keys.length) { histBox.replaceChildren(el("div", { class: "sub" }, "No earlier versions yet.")); return; }
        var card = el("div", { class: "card" }, el("h2", {}, "Earlier versions"));
        keys.forEach(function (k) {
          var v = h[k];
          card.append(el("div", { class: "hit" },
            el("span", {}, el("strong", {}, fmtDT(parseInt(k, 10) ? new Date(parseInt(k, 10)).toISOString() : "")), " ", el("span", { class: "m" }, "Rev " + (v.rev || "—") + " · " + (v.status || "") + " · " + (v.name || ""))),
            el("button", { class: "small", onclick: function () {
              var restored = normRecipe(oldId, v); restored.updatedAt = draft.updatedAt;
              editing.draft = restored; rerender();
            } }, "Load into editor")));
        });
        card.append(el("div", { class: "sub" }, "Loading a version only fills the form. Nothing changes until you click Save."));
        histBox.replaceChildren(card);
      }).catch(function (e) { histBox.replaceChildren(el("div", { class: "err" }, "Could not load history: " + explain(e))); });
    } }, "Version history") : null;

    root.append(dl,
      el("div", { class: "card" }, el("h2", {}, oldId ? "Edit recipe" : "New recipe"),
        el("div", { class: "row" },
          textField("Product", draft, "product", { list: "dl-products", ph: "e.g. OSFP DR8" }),
          textField("Stage", draft, "stage", { list: "dl-stages", ph: "e.g. Die Attach" }),
          flavorInput,
          el('div', { class: 'field' }, el('label', {}, allBox, ' All flavors')),
          textField("Stage order", draft, "stageOrder", { number: true })),
        el("div", { class: "row", style: "margin-top:12px" },
          textField("Recipe name", draft, "name", { style: "flex:3" }),
          textField("Revision", draft, "rev"),
          el("div", { class: "field" }, el("label", {}, "Status"), statusSel))),
      listEditor("Tools & equipment", draft.tools, [{ k: "name", label: "Tool" }, { k: "setting", label: "ID / setting" }, { k: "note", label: "Note" }], rerender),
      listEditor("Jigs & fixtures", draft.jigs, [{ k: "name", label: "Jig" }, { k: "id", label: "ID" }, { k: "note", label: "Note" }], rerender),
      materialEditor(draft, rerender),
      el("div", { class: "card" }, el("h2", {}, "Curing"),
        el("div", { class: "row" }, textField("Method", draft.cure, "method", { ph: "Box oven / UV / room temp" }), textField("Atmosphere", draft.cure, "atmosphere", { ph: "Air / N2" })),
        CuringProfile.mount(draft.cure, true, rememberDraft)),
      photoEditor(draft, rerender),
      el("div", { class: "card" }, el("h2", {}, "Procedure"), stepsArea),
      el("div", { class: "card" }, el("h2", {}, "Notes"), textField("", draft, "notes", { area: true })),
      el("div", { class: "actions" }, saveBtn,
        el('button', { onclick: function () { if (window.confirm('Discard this draft? Download it first if you need to keep it.')) { forgetDraft(); editing = null; confirmDelete = false; render(); } } }, 'Cancel'),
        el('button', { onclick: function () { downloadJSON({ version: 1, type: 'recipe-draft', editing: editing }, 'recipe-draft-' + Date.now() + '.json'); } }, 'Download draft'), histBtn, delBtn),
      errBox, histBox);
    return root;
  }

  // ---------- start ----------
  try {
    var recovered = JSON.parse(lsGet(RECOVERY_KEY) || 'null');
    if (recovered && recovered.draft) { editing = recovered; pageMode = editing.type === 'bom' ? 'parts' : editing.type === 'flow' ? 'flow' : editing.type === 'adhesives' ? 'adhesives' : 'recipes'; role = 'editor'; toast = 'Recovered your local draft. Refresh and compare before saving if another user has edited it.'; }
  } catch (e) {}
  tick(); setInterval(tick, 1000);
  render();
  load();
  setInterval(function () { if (!document.hidden && loaded && !editing && !busy) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && loaded && !editing && !busy) load(); });
})();
</script>
</body>
</html>
