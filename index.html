<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Process Recipe Library</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface2: #eef1f5; --text: #1a2230; --muted: #5d6879;
  --border: #d9dee6; --accent: #1b6ef3; --accent-text: #ffffff; --ok: #1a7f4b; --ok-bg: #e0f4e9;
  --warn: #9a6200; --warn-bg: #fdf0d2; --bad: #b3261e; --bad-bg: #fbe4e2; --chart: #1b6ef3;
  box-sizing: border-box; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --surface2: #232b37; --text: #e8ecf2; --muted: #9aa5b5;
    --border: #2f3947; --accent: #5b9bff; --accent-text: #0b1220; --ok: #62d39a; --ok-bg: #173526;
    --warn: #f0be5a; --warn-bg: #3a2e12; --bad: #ff8d85; --bad-bg: #3b1a18; --chart: #5b9bff; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
header.top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
header.top .actions { justify-content: flex-end; }
.clock { text-align: center; line-height: 1.25; }
.clock-date { font-size: 14px; color: var(--muted); }
.clock-time { font-size: 26px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clock-rev { font-size: 12px; color: var(--muted); margin-top: 2px; }
@media (max-width: 820px) {
  header.top { grid-template-columns: 1fr; }
  header.top .actions { justify-content: flex-start; }
  .clock { order: -1; text-align: left; }
}
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; flex: 1; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
select, input, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 40px; }
textarea { min-height: 90px; resize: vertical; }
select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .6; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tab { border-radius: 999px; padding: 6px 14px; min-height: 36px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.tab .n { opacity: .7; margin-right: 6px; font-variant-numeric: tabular-nums; }
.recipe-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
.recipe-head h3 { margin: 0 0 4px; font-size: 20px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); }
.badge.Released { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.Draft { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge.Obsolete { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
ol.steps { margin: 0; padding-left: 22px; } ol.steps li { margin-bottom: 6px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px; }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.hit { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; margin-bottom: 8px; background: var(--surface); align-items: center; }
.hit span.m { color: var(--muted); font-size: 13px; }
.edit-row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) auto; align-items: end; margin-bottom: 8px;
  padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.gallery figure { margin: 0; }
.thumb { padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; width: 100%; background: var(--surface2); display: block; min-height: 0; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--surface2); }
.gallery figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
img.broken { background: var(--surface2); min-height: 120px; color: var(--muted); font-size: 12px; }
.photo-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
.pe { border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.pe img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; background: var(--surface2); }
.lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.lb-img { max-width: 100%; max-height: 80vh; display: flex; }
.lb-img img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 6px; }
.lb-cap { color: #fff; margin-top: 10px; text-align: center; font-size: 14px; }
.lb button { position: absolute; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 22px; padding: 0; }
.lb .lb-x { top: 12px; right: 12px; } .lb .lb-prev { left: 12px; top: 50%; } .lb .lb-next { right: 12px; top: 50%; }
@media print {
  .noprint { display: none !important; }
  body { background: #fff; color: #000; }
  .card { border-color: #999; break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div>
      <h1>Process Recipe Library</h1>
      <div class="sub">Product → Flavor → Stage. Tools, epoxies, jigs and curing in one place.</div>
    </div>
    <div class="clock" aria-label="Current date and time">
      <div class="clock-date" id="clockDate"></div>
      <div class="clock-time" id="clockTime"></div>
      <div class="clock-rev" id="clockRev"></div>
    </div>
    <div class="actions" id="topActions"></div>
  </header>
  <div id="app"></div>
</div>

<script>
(function () {
  "use strict";

  // ===================== CONFIG (edit this one line) =====================
  // Paste your Firebase Realtime Database URL here (Firebase console → Build → Realtime Database).
  var DB_URL = "https://lab-tracker-nvidia-default-rtdb.firebaseio.com";
  // Everything is stored under this folder, so it never collides with your other apps in the same database.
  var ROOT = "processRecipeLibrary";
  // =======================================================================

  var BASE = DB_URL.replace(/\/+$/, "") + "/" + ROOT + "/";
  var NOT_CONFIGURED = /YOUR-PROJECT/.test(DB_URL);
  var REFRESH_MS = 30000;
  var MAX_PHOTOS = 12;

  // ---------- helpers ----------
  function el(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") e.className = v;
      else if (k === "value") e.value = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }
  function append(e, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(e, x); }); return; }
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function slug(s) { return String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x"; }
  function recipeId(r) { return slug(r.product) + "__" + slug(r.flavor) + "__" + slug(r.stage); }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
  function cmp(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function blank() {
    return { product: "", flavor: "", stage: "", stageOrder: 1, name: "", rev: "A", status: "Draft",
      tools: [], epoxies: [], jigs: [], cure: { method: "", atmosphere: "", segments: [] }, steps: [], images: [], notes: "" };
  }
  // Firebase turns arrays into objects and drops empty ones, so always normalise on read.
  function toArr(x) {
    if (Array.isArray(x)) return x.filter(function (v) { return v !== null && v !== undefined; });
    if (x && typeof x === "object") return Object.keys(x).sort(function (a, b) { return Number(a) - Number(b) || cmp(a, b); }).map(function (k) { return x[k]; });
    return [];
  }
  function normRecipe(id, r) {
    var o = Object.assign(blank(), r || {});
    ["tools", "epoxies", "jigs", "steps", "images"].forEach(function (k) { o[k] = toArr(o[k]); });
    o.cure = Object.assign({ method: "", atmosphere: "", segments: [] }, o.cure || {});
    o.cure.segments = toArr(o.cure.segments);
    o.id = id || recipeId(o); o._id = o.id;
    return o;
  }
  function stripLocal(r) { var o = clone(r); delete o._id; return o; }

  function fmtDT(iso) {
    if (!iso) return "—";
    var d = new Date(iso); if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- state ----------
  var recipes = [], libUpdated = "", lastSig = "";
  var role = lsGet("rl-role") === "editor" ? "editor" : "viewer";
  var sel = { product: "", flavor: "", stage: "" };
  var query = "", editing = null;
  var loaded = false, loadError = "", busy = "", toast = "", confirmDelete = false;
  try { var s0 = JSON.parse(lsGet("rl-sel") || "null"); if (s0) sel = s0; } catch (e) {}
  function canEdit() { return role === "editor"; }

  var app = document.getElementById("app");
  var topActions = document.getElementById("topActions");
  var clockDate = document.getElementById("clockDate"), clockTime = document.getElementById("clockTime"), clockRev = document.getElementById("clockRev");

  function tick() {
    var n = new Date();
    clockDate.textContent = n.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    clockTime.textContent = n.toLocaleTimeString("en-GB", { hour12: false });
  }
  function renderRev() { clockRev.textContent = libUpdated ? "Last revision: " + fmtDT(libUpdated) : ""; }

  // ---------- database layer (Firebase Realtime Database REST) ----------
  function dbReq(method, path, body, query) {
    var opt = { method: method, cache: "no-store" };
    if (body !== undefined) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
    return fetch(BASE + path + ".json" + (query || ""), opt).then(function (res) {
      if (!res.ok) { var e = new Error("Database " + method + " failed (" + res.status + ")"); e.status = res.status; throw e; }
      return res.json();
    });
  }
  function dbGet(p, q) { return dbReq("GET", p, undefined, q); }
  function dbPut(p, v) { return dbReq("PUT", p, v); }
  function dbDel(p) { return dbReq("DELETE", p); }
  function explain(e) {
    if (e.cancelled) return "";
    if (e.status === 401 || e.status === 403) return "The database refused access. In Firebase → Realtime Database → Rules, allow read and write for this app.";
    if (e.status === 404) return "Database not found. Check DB_URL at the top of index.html.";
    if (e.name === "TypeError") return "Cannot reach the database. Check your network connection and DB_URL.";
    return e.message || "Unknown error";
  }
  function touchMeta(ts) { return dbPut("meta/updatedAt", ts); }

  function load(force) {
    if (NOT_CONFIGURED) return Promise.resolve();
    return Promise.all([dbGet("recipes"), dbGet("meta/updatedAt")]).then(function (r) {
      var obj = r[0] || {};
      var list = Object.keys(obj).map(function (k) { return normRecipe(k, obj[k]); });
      var newest = list.reduce(function (m, x) { return x.updatedAt && x.updatedAt > m ? x.updatedAt : m; }, "");
      var ts = (r[1] && r[1] > newest) ? r[1] : (newest || r[1] || "");
      var sig = JSON.stringify([list, ts]);
      var first = !loaded;
      loaded = true; loadError = "";
      if (first || force || sig !== lastSig) { recipes = list; libUpdated = ts; lastSig = sig; render(); }
    }).catch(function (e) {
      if (!loaded) { loadError = "Could not load recipes: " + explain(e); render(); }
    });
  }

  // ---------- photos ----------
  var imgCache = {}, imgPending = {};
  function resizeImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 1400 / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
        var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var out = c.toDataURL("image/jpeg", 0.78);
        if (out.length > 900000) out = c.toDataURL("image/jpeg", 0.6);
        resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Could not read " + file.name + " (use a JPG or PNG)")); };
      img.src = url;
    });
  }
  function getImage(id) {
    if (imgCache[id]) return Promise.resolve(imgCache[id]);
    if (imgPending[id]) return imgPending[id];
    imgPending[id] = dbGet("images/" + id).then(function (v) {
      delete imgPending[id];
      if (!v || !v.data) throw new Error("missing photo");
      imgCache[id] = v.data; return v.data;
    }).catch(function (e) { delete imgPending[id]; throw e; });
    return imgPending[id];
  }
  function imgEl(id, alt) {
    var i = el("img", { alt: alt });
    if (imgCache[id]) i.src = imgCache[id];
    else getImage(id).then(function (u) { i.src = u; }).catch(function () { i.classList.add("broken"); });
    return i;
  }
  function uploadPending(out, draft, btn) {
    var todo = [];
    draft.images.forEach(function (im, i) { if (im._data && !im.id) todo.push(i); });
    var chain = Promise.resolve(), n = 0;
    todo.forEach(function (i) {
      chain = chain.then(function () {
        n++; btn.textContent = "Uploading photo " + n + "/" + todo.length + "…";
        var id = "img-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
        return dbPut("images/" + id, { data: draft.images[i]._data }).then(function () { draft.images[i].id = id; imgCache[id] = draft.images[i]._data; });
      });
    });
    return chain.then(function () {
      btn.textContent = "Saving…";
      out.images = draft.images.filter(function (im) { return im.id; }).map(function (im) { return { id: im.id, caption: String(im.caption || "").trim() }; });
    });
  }

  var lbClose = null;
  function openLightbox(list, idx) {
    if (lbClose) lbClose();
    var i = idx, imgBox = el("div", { class: "lb-img" }), cap = el("div", { class: "lb-cap" });
    var overlay = el("div", { class: "lb", role: "dialog", "aria-modal": "true", "aria-label": "Photo viewer", onclick: function (e) { if (e.target === overlay) close(); } });
    function show() {
      imgBox.replaceChildren(imgEl(list[i].id, list[i].caption || "Process photo"));
      cap.textContent = (list[i].caption ? list[i].caption + "  " : "") + "(" + (i + 1) + "/" + list.length + ")";
    }
    function go(d) { i = (i + d + list.length) % list.length; show(); }
    function close() { overlay.remove(); document.removeEventListener("keydown", onKey); lbClose = null; }
    function onKey(e) { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); }
    var x = el("button", { class: "lb-x", "aria-label": "Close", onclick: close }, "✕");
    overlay.append(x, imgBox, cap);
    if (list.length > 1) overlay.append(el("button", { class: "lb-prev", "aria-label": "Previous photo", onclick: function () { go(-1); } }, "‹"),
      el("button", { class: "lb-next", "aria-label": "Next photo", onclick: function () { go(1); } }, "›"));
    document.body.appendChild(overlay); document.addEventListener("keydown", onKey); lbClose = close; show(); x.focus();
  }
  function renderPhotos(r) {
    var list = (r.images || []).filter(function (im) { return im && im.id; });
    if (!list.length) return null;
    var g = el("div", { class: "gallery" });
    list.forEach(function (im, i) {
      g.append(el("figure", {},
        el("button", { class: "thumb", "aria-label": "Open photo: " + (im.caption || (i + 1)), onclick: function () { openLightbox(list, i); } }, imgEl(im.id, im.caption || "Process photo")),
        im.caption ? el("figcaption", {}, im.caption) : null));
    });
    return section("Photos", g);
  }
  function photoEditor(draft, rerender) {
    var box = el("div", { class: "card" }, el("h2", {}, "Photos"));
    var status = el("div", { class: "sub", role: "status" });
    var grid = el("div", { class: "photo-edit" });
    function move(i, d) { var t = draft.images[i]; draft.images[i] = draft.images[i + d]; draft.images[i + d] = t; rerender(); }
    draft.images.forEach(function (im, i) {
      var pic = im._data ? el("img", { src: im._data, alt: im.caption || "New photo" }) : imgEl(im.id, im.caption || "Photo");
      grid.append(el("div", { class: "pe" }, pic,
        textField("Caption", im, "caption", { ph: "e.g. Dispense pattern" }),
        el("div", { class: "actions" },
          el("button", { class: "small", "aria-label": "Move earlier", disabled: i === 0, onclick: function () { move(i, -1); } }, "◀"),
          el("button", { class: "small", "aria-label": "Move later", disabled: i === draft.images.length - 1, onclick: function () { move(i, 1); } }, "▶"),
          el("button", { class: "small danger", onclick: function () { draft.images.splice(i, 1); rerender(); } }, "Remove"))));
    });
    if (draft.images.length) box.append(grid);
    var file = el("input", { type: "file", accept: "image/*", multiple: true, style: "display:none", onchange: function (e) {
      var files = Array.prototype.slice.call(e.target.files); e.target.value = "";
      if (!files.length) return;
      if (draft.images.length + files.length > MAX_PHOTOS) { status.textContent = "Up to " + MAX_PHOTOS + " photos per recipe."; return; }
      status.textContent = "Processing " + files.length + " photo(s)…";
      var chain = Promise.resolve();
      files.forEach(function (f) {
        chain = chain.then(function () { return resizeImage(f).then(function (d) { draft.images.push({ id: "", caption: "", _data: d }); }); });
      });
      chain.then(function () { rerender(); }).catch(function (err) { status.textContent = err.message; rerender(); });
    } });
    box.append(file, el("div", { class: "actions" }, el("button", { onclick: function () { file.click(); } }, "+ Add photos"), status),
      el("div", { class: "sub", style: "margin-top:8px" }, "Photos are resized and uploaded when you click Save. Removing a photo only unlinks it from the recipe."));
    return box;
  }

  // ---------- backup / import ----------
  function downloadBackup() {
    busy = "Preparing backup…"; render();
    dbGet("images").then(function (imgs) {
      var data = { version: 2, updatedAt: new Date().toISOString(), recipes: recipes.map(stripLocal), images: imgs || {} };
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      a.download = "recipe-library-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      busy = ""; render();
    }).catch(function (e) { busy = ""; toast = "Backup failed: " + explain(e); render(); });
  }
  function importData(d, askText) {
    var list = Array.isArray(d) ? d : (d.recipes || []);
    var imgs = (d && d.images) || {};
    if (!list.length) { toast = "The file has no recipes."; render(); return Promise.resolve(); }
    if (!window.confirm(askText || ("Add " + list.length + " recipes? Recipes with the same product/flavor/stage will be replaced."))) return Promise.resolve();
    busy = "Importing…"; render();
    var chain = Promise.resolve();

      listEditor("Epoxies & materials", draft.epoxies, [{ k: "name", label: "Material" }, { k: "pn", label: "P/N" }, { k: "supplier", label: "Supplier" },
        { k: "mix", label: "Mix / dispense" }, { k: "potLife", label: "Pot life" }, { k: "storage", label: "Storage" }], rerender),
      el("div", { class: "card" }, el("h2", {}, "Curing"),
        el("div", { class: "row" }, textField("Method", draft.cure, "method", { ph: "Box oven / UV / room temp" }), textField("Atmosphere", draft.cure, "atmosphere", { ph: "Air / N2" })),
        el("div", { class: "sub", style: "margin:10px 0" }, "Each segment ramps from the previous temperature to its target over the given minutes. Same temperature as before = hold. The chart starts at 25 °C."),
        listEditor("Segments", draft.cure.segments, [{ k: "label", label: "Label" }, { k: "temp", label: "Target °C", number: true }, { k: "min", label: "Minutes", number: true }], rerender)),
      photoEditor(draft, rerender),
      el("div", { class: "card" }, el("h2", {}, "Procedure"), stepsArea),
      el("div", { class: "card" }, el("h2", {}, "Notes"), textField("", draft, "notes", { area: true })),
      el("div", { class: "actions" }, saveBtn,
        el("button", { onclick: function () { editing = null; confirmDelete = false; render(); } }, "Cancel"), histBtn, delBtn),
      errBox, histBox);
    return root;
  }

  // ---------- start ----------
  tick(); setInterval(tick, 1000);
  render();
  load();
  setInterval(function () { if (!document.hidden && loaded && !editing && !busy) load(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && loaded && !editing && !busy) load(); });
})();
</script>
</body>
