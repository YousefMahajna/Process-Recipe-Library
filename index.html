<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Process Recipe Library</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface2: #eef1f5; --text: #1a2230; --muted: #5d6879;
  --border: #d9dee6; --accent: #1b6ef3; --accent-text: #ffffff; --ok: #1a7f4b; --ok-bg: #e0f4e9;
  --warn: #9a6200; --warn-bg: #fdf0d2; --bad: #b3261e; --bad-bg: #fbe4e2; --chart: #1b6ef3;
  box-sizing: border-box; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --surface2: #232b37; --text: #e8ecf2; --muted: #9aa5b5;
    --border: #2f3947; --accent: #5b9bff; --accent-text: #0b1220; --ok: #62d39a; --ok-bg: #173526;
    --warn: #f0be5a; --warn-bg: #3a2e12; --bad: #ff8d85; --bad-bg: #3b1a18; --chart: #5b9bff; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
header.top { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
header.top .actions { justify-content: flex-end; }
.clock { text-align: center; line-height: 1.25; }
.clock-date { font-size: 14px; color: var(--muted); }
.clock-time { font-size: 26px; font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clock-rev { font-size: 12px; color: var(--muted); margin-top: 2px; }
@media (max-width: 820px) {
  header.top { grid-template-columns: 1fr; }
  header.top .actions { justify-content: flex-start; }
  .clock { order: -1; text-align: left; }
}
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; flex: 1; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
select, input, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 40px; }
textarea { min-height: 90px; resize: vertical; }
select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .6; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
button.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.tab { border-radius: 999px; padding: 6px 14px; min-height: 36px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.tab .n { opacity: .7; margin-right: 6px; font-variant-numeric: tabular-nums; }
.recipe-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
.recipe-head h3 { margin: 0 0 4px; font-size: 20px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); }
.badge.Released { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.Draft { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.badge.Obsolete { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
ol.steps { margin: 0; padding-left: 22px; } ol.steps li { margin-bottom: 6px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px; }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.hit { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; margin-bottom: 8px; background: var(--surface); }
.hit span.m { color: var(--muted); font-size: 13px; }
.edit-row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) auto; align-items: end; margin-bottom: 8px;
  padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; }
.ok-msg { color: var(--ok); font-size: 13px; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.gallery figure { margin: 0; }
.thumb { padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; width: 100%; background: var(--surface2); display: block; min-height: 0; }
.gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.gallery figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
img.broken { background: var(--surface2); min-height: 120px; color: var(--muted); font-size: 12px; }
.photo-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
.pe { border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.pe img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; }
.lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.lb-img { max-width: 100%; max-height: 80vh; display: flex; }
.lb-img img { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 6px; }
.lb-cap { color: #fff; margin-top: 10px; text-align: center; font-size: 14px; }
.lb button { position: absolute; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 22px; padding: 0; }
.lb .lb-x { top: 12px; right: 12px; } .lb .lb-prev { left: 12px; top: 50%; } .lb .lb-next { right: 12px; top: 50%; }
@media print {
  .noprint { display: none !important; }
  body { background: #fff; color: #000; }
  .card { border-color: #999; break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top noprint">
    <div>
      <h1>Process Recipe Library</h1>
      <div class="sub">Product → Flavor → Stage. Tools, epoxies, jigs and curing in one place.</div>
    </div>
    <div class="clock" aria-label="Current date and time">
      <div class="clock-date" id="clockDate"></div>
      <div class="clock-time" id="clockTime"></div>
      <div class="clock-rev" id="clockRev"></div>
    </div>
    <div class="actions" id="topActions"></div>
  </header>
  <div id="login"></div>
  <div id="app"></div>
</div>

<script>
(function () {
  "use strict";

  // ============ CONFIG: change these to match your GitHub repo ============
  var CFG = { owner: "YousefMahajna", repo: "Process-Recipe-Library", branch: "main", path: "data.json" };
  // =========================================================================

  var API = "https://api.github.com/repos/" + CFG.owner + "/" + CFG.repo + "/contents/" + CFG.path;

  // ---------- helpers ----------
  function el(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") e.className = v;
      else if (k === "value") e.value = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }
  function append(e, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(e, x); }); return; }
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function slug(s) { return String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x"; }
  function recipeId(r) { return slug(r.product) + "__" + slug(r.flavor) + "__" + slug(r.stage); }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
  function cmp(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function blank() {
    return { product: "", flavor: "", stage: "", stageOrder: 1, name: "", rev: "A", status: "Draft",
      tools: [], epoxies: [], jigs: [], cure: { method: "", atmosphere: "", segments: [] }, steps: [], images: [], notes: "" };
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // base64 <-> utf8
  function b64decode(b64) {
    var bin = atob(b64.replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  // ---------- state ----------
  var recipes = [];
  var token = lsGet("rl-token") || "";
  var canEdit = false;
  var sel = { product: "", flavor: "", stage: "" };
  var query = "";
  var editing = null;
  var libUpdated = "";
  var loaded = false, loadError = "", busy = false, toast = "";
  var confirmDelete = false, showLogin = false;
  try { var s0 = JSON.parse(lsGet("rl-sel") || "null"); if (s0) sel = s0; } catch (e) {}

  var app = document.getElementById("app");
  var topActions = document.getElementById("topActions");
  var loginBox = document.getElementById("login");
  var clockDate = document.getElementById("clockDate"), clockTime = document.getElementById("clockTime"), clockRev = document.getElementById("clockRev");

  function fmtDT(iso) {
    if (!iso) return "—";
    var d = new Date(iso); if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }
  function tick() {
    var n = new Date();
    clockDate.textContent = n.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    clockTime.textContent = n.toLocaleTimeString("en-GB", { hour12: false });
  }
  function renderRev() { clockRev.textContent = libUpdated ? "Last revision: " + fmtDT(libUpdated) : ""; }

  // ---------- GitHub API layer ----------
  function ghHeaders() {
    var h = { "Accept": "application/vnd.github+json" };
    if (token) h["Authorization"] = "Bearer " + token;
    return h;
  }
  function httpError(res, what) {
    var e = new Error(what + " failed (" + res.status + ")"); e.status = res.status; return e;
  }
  // Latest data + sha via the API (needs a token for reliable use on shared networks)
  function apiGet() {
    return fetch(API + "?ref=" + encodeURIComponent(CFG.branch) + "&t=" + Date.now(), { headers: ghHeaders(), cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw httpError(res, "Reading data.json");
        return res.json();
      }).then(function (j) {
        if (!j.content) throw new Error("data.json is too large for the GitHub contents API (over 1 MB). Split the data.");
        var data = JSON.parse(b64decode(j.content));
        return { data: normalize(data), sha: j.sha };
      });
  }
  function apiPut(data, sha, message) {
    var body = { message: message, content: b64encode(JSON.stringify(data, null, 2)), sha: sha, branch: CFG.branch };
    return fetch(API, { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()), body: JSON.stringify(body) })
      .then(function (res) {
        if (!res.ok) throw httpError(res, "Saving");
        return res.json();
      });
  }
  // Read-only path for guests: same-origin file on GitHub Pages (no token, no API rate limit)
  function pagesGet() {
    return fetch("data.json?t=" + Date.now(), { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw httpError(res, "Loading data.json");
      return res.json();
    }).then(normalize);
  }
  function normalize(d) {
    if (Array.isArray(d)) d = { version: 1, recipes: d };
    d.recipes = (d.recipes || []).map(function (r) {
      var o = Object.assign(blank(), r);
      o.tools = Array.isArray(o.tools) ? o.tools : [];
      o.epoxies = Array.isArray(o.epoxies) ? o.epoxies : [];
      o.jigs = Array.isArray(o.jigs) ? o.jigs : [];
      o.steps = Array.isArray(o.steps) ? o.steps : [];
      o.images = Array.isArray(o.images) ? o.images : [];
      o.cure = o.cure || { method: "", atmosphere: "", segments: [] };
      o.cure.segments = Array.isArray(o.cure.segments) ? o.cure.segments : [];
      o.id = o.id || recipeId(o);
      return o;
    });
    return d;
  }

  function setRecipes(list, ts) {
    recipes = list.map(function (r) { var o = clone(r); o._id = o.id; return o; });
    var newest = recipes.reduce(function (m, r) { return r.updatedAt && r.updatedAt > m ? r.updatedAt : m; }, "");
    libUpdated = (ts && ts > newest) ? ts : (newest || ts || "");
  }

  function load() {
    loadError = "";
    var p = token ? apiGet().then(function (r) { return r.data; }).catch(function (e) {
      // Token problem or rate limit: fall back to the Pages copy so people can still read
      if (e.status === 401) { token = ""; canEdit = false; lsDel("rl-token"); toast = "Saved token was rejected and was removed."; }
      return pagesGet();
    }) : pagesGet();
    return p.then(function (d) {
      setRecipes(d.recipes, d.updatedAt); loaded = true; render();
    }).catch(function (e) {
      loadError = (location.protocol === "file:")
        ? "Open this page from GitHub Pages (or a local web server). Browsers block loading data.json from a file:// page."
        : "Could not load recipes: " + e.message;
      render();
    });
  }

  // Read the latest file, apply one change, write it back. Retries on a race (409/422).
  function commit(mutator, message, attempt) {
    attempt = attempt || 0;
    return apiGet().then(function (cur) {
      mutator(cur.data);
      cur.data.updatedAt = new Date().toISOString();
      var size = JSON.stringify(cur.data).length;
      if (size > 900000) throw new Error("data.json is getting close to GitHub's 1 MB API limit.");
      snapshot(cur.data);
      return apiPut(cur.data, cur.sha, message).then(function () { return cur.data; });
    }).catch(function (e) {
      if ((e.status === 409 || e.status === 422) && attempt < 2) return commit(mutator, message, attempt + 1);
      throw e;
    });
  }
  function snapshot(data) {
    try {
      var ring = JSON.parse(lsGet("rl-backup") || "[]");
      ring.push({ t: new Date().toISOString(), d: data });
      while (ring.length > 5) ring.shift();
      lsSet("rl-backup", JSON.stringify(ring));
    } catch (e) {}
  }
  function explain(e) {
    if (e.status === 401) return "GitHub rejected the token (401). Log in again with a valid token.";
    if (e.status === 403) return "No permission (403): the token needs Contents → Read and write on " + CFG.owner + "/" + CFG.repo + ", or you hit a rate limit.";
    if (e.status === 404) return "Repo or data.json not found (404). Check owner/repo/path in the CONFIG block and that data.json exists on " + CFG.branch + ".";
    return e.message || "Unknown error";
  }

  // ---------- photos ----------
  var CONTENTS = "https://api.github.com/repos/" + CFG.owner + "/" + CFG.repo + "/contents/";
  var imgCache = {};            // path -> data URL (so fresh uploads show before Pages rebuilds)
  var MAX_PHOTOS = 12;

  function resizeImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 1600 / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
        var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var out = c.toDataURL("image/jpeg", 0.8);
        if (out.length > 1300000) out = c.toDataURL("image/jpeg", 0.6);
        resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Could not read " + file.name + " (use a JPG or PNG)")); };
      img.src = url;
    });
  }
  function putNewFile(path, dataUrl, attempt) {
    attempt = attempt || 0;
    var body = { message: "Add photo " + path, content: dataUrl.split(",")[1], branch: CFG.branch };
    return fetch(CONTENTS + path, { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()), body: JSON.stringify(body) })
      .then(function (res) {
        if (res.status === 409 && attempt < 2) return putNewFile(path, dataUrl, attempt + 1);
        if (!res.ok) throw httpError(res, "Uploading photo");
        return res.json();
      });
  }
  function uploadPending(out, draft, btn) {
    var todo = [];
    draft.images.forEach(function (im, i) { if (im._data && !im.path) todo.push(i); });
    var chain = Promise.resolve(), n = 0;
    todo.forEach(function (i) {
      chain = chain.then(function () {
        n++; btn.textContent = "Uploading photo " + n + "/" + todo.length + "…";
        var path = "images/" + slug(out.product) + "-" + slug(out.stage) + "-" + Date.now().toString(36) + "-" + i + ".jpg";
        return putNewFile(path, draft.images[i]._data).then(function () { draft.images[i].path = path; imgCache[path] = draft.images[i]._data; });
      });
    });
    return chain.then(function () {
      btn.textContent = "Saving…";
      out.images = draft.images.filter(function (im) { return im.path; }).map(function (im) { return { path: im.path, caption: String(im.caption || "").trim() }; });
    });
  }
  function loadViaApi(path) {
    return fetch(CONTENTS + path + "?ref=" + encodeURIComponent(CFG.branch), { headers: ghHeaders() }).then(function (r) {
      if (!r.ok) throw httpError(r, "Loading photo"); return r.json();
    }).then(function (j) {
      if (!j.content) throw new Error("photo too large");
      var url = "data:image/jpeg;base64," + j.content.replace(/\s/g, ""); imgCache[path] = url; return url;
    });
  }
  // Same-origin path works on GitHub Pages; if the Pages rebuild hasn't finished yet, fall back to the API once.
  function imgEl(path, alt) {
    var i = el("img", { src: imgCache[path] || path, alt: alt, loading: "lazy" });
    i.addEventListener("error", function () {
      if (i.dataset.fb) { i.classList.add("broken"); return; }
      i.dataset.fb = "1";
      loadViaApi(path).then(function (u) { i.src = u; }).catch(function () { i.classList.add("broken"); });
    });
    return i;
  }

  var lbClose = null;
  function openLightbox(list, idx) {
    if (lbClose) lbClose();
    var i = idx, imgBox = el("div", { class: "lb-img" }), cap = el("div", { class: "lb-cap" });
    var overlay = el("div", { class: "lb", role: "dialog", "aria-modal": "true", "aria-label": "Photo viewer", onclick: function (e) { if (e.target === overlay) close(); } });
    function show() {
      imgBox.replaceChildren(imgEl(list[i].path, list[i].caption || "Process photo"));
      cap.textContent = (list[i].caption ? list[i].caption + "  " : "") + "(" + (i + 1) + "/" + list.length + ")";
    }
    function go(d) { i = (i + d + list.length) % list.length; show(); }
    function close() { overlay.remove(); document.removeEventListener("keydown", onKey); lbClose = null; }
    function onKey(e) { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); }
    var x = el("button", { class: "lb-x", "aria-label": "Close", onclick: close }, "✕");
    overlay.append(x, imgBox, cap);
    if (list.length > 1) overlay.append(el("button", { class: "lb-prev", "aria-label": "Previous photo", onclick: function () { go(-1); } }, "‹"),
      el("button", { class: "lb-next", "aria-label": "Next photo", onclick: function () { go(1); } }, "›"));
    document.body.appendChild(overlay); document.addEventListener("keydown", onKey); lbClose = close; show(); x.focus();
  }

  function renderPhotos(r) {
    var list = (r.images || []).filter(function (im) { return im.path; });
    if (!list.length) return null;
    var g = el("div", { class: "gallery" });
    list.forEach(function (im, i) {
      g.append(el("figure", {},
        el("button", { class: "thumb", "aria-label": "Open photo: " + (im.caption || (i + 1)), onclick: function () { openLightbox(list, i); } }, imgEl(im.path, im.caption || "Process photo")),

          textField("Stage order", draft, "stageOrder", { number: true })),
        el("div", { class: "row", style: "margin-top:12px" },
          textField("Recipe name", draft, "name", { style: "flex:3" }),
          textField("Revision", draft, "rev"),
          el("div", { class: "field" }, el("label", {}, "Status"), statusSel))),
      listEditor("Tools & equipment", draft.tools, [{ k: "name", label: "Tool" }, { k: "setting", label: "ID / setting" }, { k: "note", label: "Note" }], rerender),
      listEditor("Jigs & fixtures", draft.jigs, [{ k: "name", label: "Jig" }, { k: "id", label: "ID" }, { k: "note", label: "Note" }], rerender),
      listEditor("Epoxies & materials", draft.epoxies, [{ k: "name", label: "Material" }, { k: "pn", label: "P/N" }, { k: "supplier", label: "Supplier" },
        { k: "mix", label: "Mix / dispense" }, { k: "potLife", label: "Pot life" }, { k: "storage", label: "Storage" }], rerender),
      el("div", { class: "card" }, el("h2", {}, "Curing"),
        el("div", { class: "row" }, textField("Method", draft.cure, "method", { ph: "Box oven / UV / room temp" }), textField("Atmosphere", draft.cure, "atmosphere", { ph: "Air / N2" })),
        el("div", { class: "sub", style: "margin:10px 0" }, "Each segment ramps from the previous temperature to its target over the given minutes. Same temperature as before = hold. The chart starts at 25 °C."),
        listEditor("Segments", draft.cure.segments, [{ k: "label", label: "Label" }, { k: "temp", label: "Target °C", number: true }, { k: "min", label: "Minutes", number: true }], rerender)),
      photoEditor(draft, rerender),
      el("div", { class: "card" }, el("h2", {}, "Procedure"), stepsArea),
      el("div", { class: "card" }, el("h2", {}, "Notes"), textField("", draft, "notes", { area: true })),
      el("div", { class: "actions" }, saveBtn,
        el("button", { onclick: function () { editing = null; confirmDelete = false; render(); } }, "Cancel"), delBtn),
      errBox);
    return root;
  }

  // ---------- start ----------
  tick(); setInterval(tick, 1000);
  render();
  if (token) {
    verifyToken(token).then(function (ok) { canEdit = ok; render(); }).catch(function () {});
  }
  load();
  document.addEventListener("visibilitychange", function () { if (!document.hidden && loaded && !editing && !busy) load(); });
})();
</script>
